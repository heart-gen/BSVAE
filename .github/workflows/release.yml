name: Release

on:
  push:
    tags: ["v*"]

jobs:
  test:
    uses: ./.github/workflows/tests.yml

  build-and-publish:
    needs: test
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # PyPI trusted publishing
      contents: write   # GitHub release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the version comes from the tag, so tags must be present
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install poetry
        run: |
          pipx install poetry
          pipx inject poetry "poetry-dynamic-versioning[plugin]"
      - name: Build
        id: build
        run: poetry build
      - name: Check built version matches the tag
        run: |
          whl=$(ls dist/*.whl)
          [[ "$whl" == dist/bsvae-"${GITHUB_REF_NAME#v}"-* ]] || { echo "wheel $whl does not match tag ${GITHUB_REF_NAME}"; exit 1; }
      # Trusted publishing, so there is no token: PyPI must list a publisher for
      # heart-gen/BSVAE, workflow release.yml, environment pypi.
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # a re-run of a tag already uploaded by hand must not fail on the files being there
          skip-existing: true
      # The release names the tag and carries the artifacts even if the upload
      # failed; `always()` would also run after a failed build, hence the guard.
      - name: GitHub release
        if: always() && steps.build.outcome == 'success'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
